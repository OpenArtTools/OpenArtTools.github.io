[package]
name = "openarttools"
version = "0.1.0"
description = "OpenArtTools — Contract Studio"
authors = ["Gerard Valls Montaño"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "openarttools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
